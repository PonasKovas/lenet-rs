name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout lenet-rs
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The lenet-sys build script fetches the Lenet sources (pinned
      # revision, see LENET_REV in lenet-sys/build.rs) and provisions the
      # pinned Lean toolchain on first use; cache it here.
      - name: Cache Lean toolchains
        uses: actions/cache@v6
        with:
          path: ~/.elan/toolchains
          key: lean-${{ runner.os }}-${{ hashFiles('lenet-sys/build.rs') }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Builds everything from scratch on a fresh runner: lenet-sys fetches
      # + builds Lenet (Lean) and enet-helper fetches + builds ENet; the
      # interop tests then run against the live C ENet oracle.
      - name: Tests (sans-I/O + live ENet interop)
        run: cargo test --workspace
