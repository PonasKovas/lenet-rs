name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout lenet-rs
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # lenet-sys builds Lenet (pinned at LENET_REV in lenet-sys/build.rs)
      # with elan, which fetches the Lean version that revision pins. The
      # build script installs nothing itself, so install elan here and
      # cache its toolchains (keyed on build.rs, where LENET_REV lives).
      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean toolchains
        uses: actions/cache@v6
        with:
          path: ~/.elan/toolchains
          key: lean-${{ runner.os }}-${{ hashFiles('lenet-sys/build.rs') }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (sans-I/O + live ENet interop)
        run: cargo test --workspace
