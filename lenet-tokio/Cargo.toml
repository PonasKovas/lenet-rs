[package]
name = "lenet-tokio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tokio driver for the Lenet sans-I/O ENet protocol engine"

[dependencies]
bytes = "1"
lenet = { path = "../lenet" }
log = "0.4"
thiserror = "2"
tokio = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "process", "time"] }
