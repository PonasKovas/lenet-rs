[package]
name = "lenet-tokio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Tokio driver for the Lenet sans-I/O ENet protocol engine"

[dependencies]
lenet = { path = "../lenet" }
tokio = { workspace = true }
tokio-stream = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "process", "time"] }
